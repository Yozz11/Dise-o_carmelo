    <!-- MODAL LOGIN -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          
          <div class="modal-header">
            <h5 class="modal-title" id="loginModalLabel">Iniciar Sesión</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="emailInput" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="emailInput" placeholder="nombre@ejemplo.com">
              </div>
              <div class="mb-3">
                <label for="passwordInput" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="passwordInput" placeholder="********">
              </div>
              <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberCheck">
                <label class="form-check-label" for="rememberCheck">Recordarme</label>
              </div>
            </form>
          </div>
          
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary">Ingresar</button>
          </div>

        </div>
      </div>
    </div>

          <div class="modal-body">
            <form>

                <input type="text" class="form-control" id="registerNameInput" placeholder="Tu Nombre">
              </div>
              <div class="mb-3">
                <label for="registerEmailInput" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="registerEmailInput" placeholder="nombre@ejemplo.com">

              <div class="mb-3">

                <input type="password" class="form-control" id="registerPasswordInput" placeholder="********">

            </form>
          </div>

            <button type="button" class="btn btn-success">Registrarse</button>
          </div>

        </div>
      </div>
